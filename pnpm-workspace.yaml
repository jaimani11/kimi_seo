packages:
  - "apps/*"
  - "packages/*"

# Build-script approvals — BOTH dialects on purpose:
#   allowBuilds            → pnpm 11 (what Vercel runs via the
#                            packageManager pin; v11 HARD-FAILS in CI
#                            on unapproved scripts)
#   onlyBuiltDependencies  → pnpm 10 fallback (harmless under v11)
allowBuilds:
  '@clerk/shared': true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - "@clerk/shared"
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - sharp
  - unrs-resolver

# pnpm 11 pre-run deps check would short-circuit `pnpm build` locally.
verifyDepsBeforeRun: false
