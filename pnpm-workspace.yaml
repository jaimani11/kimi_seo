packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  prisma: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false

# Build-script approvals. Use onlyBuiltDependencies (understood by
# pnpm 10 AND 11) — NOT the v11-only allowBuilds key: Vercel installs
# with pnpm 10 (chosen from lockfileVersion 9), and v10 discarded the
# whole workspace config on the unknown key, reporting an EMPTY
# workspace ("Packages found in the workspace:" → nothing) and
# ERR_PNPM_WORKSPACE_PKG_NOT_FOUND for every workspace:* dep.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - sharp
  - unrs-resolver

# pnpm 11 pre-run deps check trips over intentionally-skipped build
# scripts (see onlyBuiltDependencies note) and short-circuits
# `pnpm build` before turbo runs. Key exists since pnpm 10, so
# Vercel's installer parses it fine.
verifyDepsBeforeRun: false
