packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 reads build-script approvals here; older pnpm (Vercel's
# default without corepack) reads pnpm.onlyBuiltDependencies from the
# root package.json. Keep BOTH in sync.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  unrs-resolver: true
